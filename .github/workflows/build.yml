name: Build OpenIDEA (Windows x64)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: nako-ruru/openidea
          ref: 7b85a79f87d8c1b6f2fc1e6d0e2f1e8d3c4b5a69
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { key: x86_64-pc-windows-msvc, cache-on-failure: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:bindings
      - shell: bash
        run: |
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > tauri-noupdate.json
          pnpm tauri build --target x86_64-pc-windows-msvc --config tauri-noupdate.json
      - uses: actions/upload-artifact@v4
        with:
          name: openidea-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/openidea.exe
