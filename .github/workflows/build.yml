name: Build OpenIDEA (Windows x64)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: nako-ruru/openidea
          ref: e14ac13f8f643b7ddcfcf9d9244ad9e0cae031e4
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { key: x86_64-pc-windows-msvc, cache-on-failure: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: openidea-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/openidea.exe
